name: CI Echo Check
on: [push, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Canary failure on first attempt
        if: ${{ github.run_attempt == 1 }}
        run: |
          echo "CI verification canary failing by design on attempt 1"
          exit 1
      - name: Canary success on later attempts
        if: ${{ github.run_attempt != 1 }}
        run: echo "CI verification pipeline executed successfully"
